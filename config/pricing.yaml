# USD per million tokens (Anthropic first-party API list prices, cached 2026-10).
# cache_read defaults to 0.1 x input and cache_write to 1.25 x input (5-minute TTL)
# when omitted. Haiku 5.5 prices are for prompts up to 100K tokens.
# Update this file when prices change; the unit tests pin the arithmetic, not the prices.
models:
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_read: 0.25}
  claude-fable-5:    {input: 10.00, output: 50.00}
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_read: 0.20}
  claude-opus-5:     {input: 5.00,  output: 25.00}
  claude-opus-4-8:   {input: 5.00,  output: 25.00}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_read: 0.20}
  claude-sonnet-5:   {input: 2.00,  output: 10.00}
  claude-haiku-5-5:  {input: 0.10,  output: 0.50}
  fake-extractive:   {input: 0.00,  output: 0.00}
