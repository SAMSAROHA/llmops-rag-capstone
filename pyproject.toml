[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragapp"
version = "0.1.0"
description = "LLMOps capstone: production RAG app with tracing, evaluation, prompt versioning, cost tracking and a faithfulness release gate"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "mlflow>=3.1",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ragapp = "ragapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
