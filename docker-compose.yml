services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]

  api:
    build: .
    depends_on: [qdrant, mlflow]
    ports: ["8000:8000"]
    environment:
      # Passed through from your shell or a .env file next to this compose file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      COST_DB_PATH: /data/costs.db
    volumes:
      - api_data:/data
      - fastembed_cache:/app/.cache/fastembed

volumes:
  qdrant_data:
  mlflow_data:
  api_data:
  fastembed_cache:
